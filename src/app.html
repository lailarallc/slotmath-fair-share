<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- GoatCounter: cookieless analytics (DECISIONS 2026-08-26). Ignores
		     localhost by design — the cta_click event is verified on the deployed
		     build, adblocker off. -->
		<script
			data-goatcounter="https://lailara.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
	</body>
</html>
