<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Slot Math — Lailara LLC</title>
		<meta
			name="description"
			content="Is your shelf presence proportional to your sales — and what is the gap worth? A within-footprint allocation tool for specialty-food brands, per retailer and region."
		/>
		<link rel="stylesheet" href="/lailara/lailara-frame.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- GoatCounter: cookieless analytics (DECISIONS 2026-08-26). Ignores
		     localhost by design — verified on the deployed build, adblocker off.
		     Pre-registered rule: NEVER send the page query string (a visitor's
		     channel filter). GoatCounter's count.js hardcodes q=location.search and
		     its auto-pageview path = pathname+search, so both the pageview and the
		     cta_click event would leak ?channel=… on a deep-link arrival. Fix:
		     suppress the auto-pageview (no_onload) and fire one query-free pageview
		     ourselves — keeping the rate denominator alive without leaking selection
		     state. The cta_click event is stripped the same way in fireCta. -->
		<script>
			window.goatcounter = { no_onload: true };
		</script>
		<script
			data-goatcounter="https://lailara.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"
		></script>
		<script>
			// Fire exactly one query-free pageview once count.js is ready. Polls
			// because count.js is async; wrapping get_data blanks the query string
			// (q) and the path (p → pathname only), then restores it.
			(function () {
				var tries = 0;
				(function fire() {
					var gc = window.goatcounter;
					if (gc && typeof gc.count === 'function' && typeof gc.get_data === 'function') {
						var orig = gc.get_data;
						gc.get_data = function (vars) {
							var d = orig(vars);
							d.p = location.pathname;
							d.q = '';
							return d;
						};
						try { gc.count({}); } finally { gc.get_data = orig; }
						return;
					}
					if (tries++ < 100) setTimeout(fire, 50);
				})();
			})();
		</script>
	</body>
</html>
