name: Deploy

# Static SvelteKit build, built in CI (Path B) and pushed to Cloudflare Pages via
# wrangler. Data is a committed frozen JSON — CI never touches the DB (DECISIONS
# 2026-08-26 "Data flow: freeze-and-commit"). Cloudflare Git integration stays OFF;
# this main-only, guarded workflow is the only deploy path.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-verify without a dummy commit

permissions:
  contents: read

# Third-party actions pinned to a full commit SHA (tag in the trailing comment) —
# a mutable @vN could be moved onto different code while this job holds deploy
# credentials. Bump SHA + comment together. npx pins wrangler by npm major.
jobs:
  # D2 data invariant — asserts the committed data/slotmath.json against canon +
  # the honesty structure. deploy needs this, so a drifted cell can never ship.
  invariant:
    name: Data invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Assert the frozen data contract
        run: node scripts/check-invariants.mjs

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [invariant]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Confirm Cloudflare credentials are present and well-formed
        # An absent token makes wrangler fail with an auth error that looks like a
        # bad token rather than a missing one; a pasted account ID with a trailing
        # newline stays non-empty but malformed (wrangler then errors 7003). Catch
        # both here. Neither value is echoed.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on this repository."
            missing=1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set on this repository."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add them on the repo that RUNS this workflow (MsShawnP/slotmath-fair-share):"
            echo "::error::  Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if ! printf '%s' "$CF_ACCOUNT_ID" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is set but not a 32-char hex account ID"
            echo "::error::(likely a trailing newline or the wrong value). Re-set it."
            exit 1
          fi
          echo "cloudflare credentials present and account id well-formed"

      - name: Engagement deploy-guard
        # No-op unless an active (non-demo) engagement.yml is present. Client mode is
        # runtime-only and must never deploy (engagement deploy-guard kit).
        run: node scripts/engagement-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Create the Pages project if it does not exist
        # First deploy needs the project; later deploys skip. `project list` is
        # tolerant (a fresh account lists nothing); a real auth failure surfaces here.
        # Project name is `slotmath` EXPLICITLY — not the repo name — so "fair-share"
        # never lands on the *.pages.dev URL (DECISIONS 2026-08-26 "Deploy").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -q "slotmath"; then
            echo "Pages project 'slotmath' already exists"
          else
            npx --yes wrangler@4 pages project create slotmath --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy build \
            --project-name=slotmath \
            --branch=main
