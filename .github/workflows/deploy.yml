name: Deploy

# Static SvelteKit build, built in CI (Path B) and pushed to Cloudflare Pages via
# the org reusable deploy workflow. Data is a committed frozen JSON — CI never
# touches the DB (DECISIONS 2026-08-26 "Data flow: freeze-and-commit"). Cloudflare
# Git integration stays OFF; this main-only, guarded workflow is the only deploy path.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-verify without a dummy commit

permissions:
  contents: read

# Third-party actions pinned to a full commit SHA (tag in the trailing comment) —
# a mutable @vN could be moved onto different code while this job holds deploy
# credentials. Bump SHA + comment together. npx pins wrangler by npm major.
jobs:
  # D2 data invariant — asserts the committed data/slotmath.json against canon +
  # the honesty structure. deploy needs this, so a drifted cell can never ship.
  invariant:
    name: Data invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Assert the frozen data contract
        run: node scripts/check-invariants.mjs

  # Build the static site and hand it to the reusable deploy job as an artifact.
  # No Cloudflare credentials here — the deploy job owns those.
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [invariant]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Engagement deploy-guard
        # No-op unless an active (non-demo) engagement.yml is present. Client mode is
        # runtime-only and must never deploy (engagement deploy-guard kit).
        run: node scripts/engagement-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build

  # Deploy via the org reusable workflow. Project name is `slotmath` EXPLICITLY —
  # not the repo name — so "fair-share" never lands on the *.pages.dev URL
  # (DECISIONS 2026-08-26 "Deploy"). secrets: inherit passes the org-level
  # CLOUDFLARE_* secrets through.
  deploy:
    name: Deploy
    needs: [build]
    uses: lailarallc/reusable-workflows/.github/workflows/pages-deploy.yml@v1
    with:
      project_name: slotmath
      artifact_name: site
    secrets: inherit
